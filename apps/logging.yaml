---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector-logging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.vector.dev
      chart: vector
      targetRevision: "0.56.0"
      helm:
        valueFiles:
          - $back-repo/monitoring/logs/values-vector.yaml
    - repoURL: https://github.com/Abeehiltz/k8s-deployment
      path: monitoring/logs
      targetRevision: HEAD
      ref: back-repo
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: false
      prune: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - kind: Secret
      namespace: monitoring
      jsonPointers:
        - /data/ca.crt
        - /data/tls.crt
        - /data/tls.key
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
