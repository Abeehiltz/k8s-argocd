---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-argocd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abeehiltz/k8s-deployment
    path: cert-manager
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cert-manager
  syncPolicy: {}
