---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - chart: argo-cd
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 9.4.5
      helm:
        skipCrds: true
        valueFiles:
          - $back-repo/argocd/values.yaml
    - repoURL: https://github.com/Abeehiltz/k8s-deployment
      path: argocd
      targetRevision: HEAD
      ref: back-repo
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      enabled: false
      prune: true


