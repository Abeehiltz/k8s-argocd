---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calibre-argocd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abeehiltz/k8s-deployment
    path: calibre
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: calibre
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
