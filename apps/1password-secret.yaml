---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 1password
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://1password.github.io/connect-helm-charts/
      chart: connect
      targetRevision: "2.0.3"
      helm:
        valueFiles:
          - $back-repo/1password-secret/values.yaml
    - repoURL: https://github.com/Abeehiltz/k8s-deployment
      path: 1password-secret
      targetRevision: HEAD
      ref: back-repo
  destination:
    server: "https://kubernetes.default.svc"
    namespace: 1password-secret
  syncPolicy: {}
