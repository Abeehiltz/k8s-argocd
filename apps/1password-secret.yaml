---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 1password-argocd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abeehiltz/k8s-deployment
    path: 1password-secret
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: 1password-secret
  syncPolicy: {}
