apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
spec:
  project: default
  sources:
    - chart: authelia
      repoURL: https://charts.authelia.com
      targetRevision: 0.10.49
      helm:
        valueFiles:
          - $back-repo/authelia/values.yaml
    - repoURL: https://github.com/Abeehiltz/k8s-deployment
      path: authelia
      targetRevision: HEAD
      ref: back-repo
  destination:
    namespace: authelia
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true

