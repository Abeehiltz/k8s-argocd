---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: argocd
spec:
  project: default
  source:
      repoURL: https://github.com/Abeehiltz/k8s-deployment
      path: media
      targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: media
  syncPolicy: {}
