---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-storage-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abeehiltz/k8s-deployment
    path: storage/local
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: local-path-storage
  syncPolicy: {}

