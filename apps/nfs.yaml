---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-argocd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abeehiltz/k8s-deployment
    path: nfs
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nfs-provisioner
  syncPolicy:
    syncOptions:
      - createNamespace=true
    automated:
      prune: true
      selfHeal: true
