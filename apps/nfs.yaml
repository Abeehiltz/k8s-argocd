---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-argocd-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abeehiltz/k8s-deployment
    path: storage/nfs
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: storage
  syncPolicy: 
    automated:
      enabled: false
