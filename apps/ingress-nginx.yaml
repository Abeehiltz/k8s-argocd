---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: "4.11.3"
      helm:
        valueFiles:
          - $back-repo/networking/ingress-nginx/values.yaml
    - repoURL: https://github.com/Abeehiltz/k8s-deployment
      path: networking/ingress-nginx
      targetRevision: HEAD
      ref: back-repo
  destination:
    server: "https://kubernetes.default.svc"
    namespace: ingress-nginx
  syncPolicy:
    syncOptions:
      - createNamespace=true
    automated:
      prune: true
      selfHeal: true
