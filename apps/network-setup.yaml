apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-setup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Abeehiltz/k8s-deployment
    path: networking
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default # Kustomization will handle it
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
