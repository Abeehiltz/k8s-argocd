---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Abeehiltz/k8s-argocd"
    path: apps
    targetRevision: HEAD
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  applications:
    - name: nfs
      path: apps/nfs.yaml
    - name: calibre
      path: manifests/calibre.yaml
