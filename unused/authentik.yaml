---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: "2025.12.3"
      helm:
        valueFiles:
          - $back-repo/authentik/values.yaml
    - repoURL: https://github.com/Abeehiltz/k8s-deployment
      path: authentik
      targetRevision: HEAD
      ref: back-repo
  destination:
    server: "https://kubernetes.default.svc"
    namespace: authentik
  syncPolicy:
    automated:
      enabled: false
      prune: true


